name: Publish VS Code Extension

on:
  push:
    branches: [ "devops-cicd-gitpod-ms" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      # :one: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # :two: Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # :three: Install dependencies
      - name: Install dependencies
        run: npm install

      # :four: Build extension
      - name: Build extension
        run: npm run build

      # :five: Run tests
      - name: Run tests
        run: npx jest || echo "No tests found"

      # :six: Custom Version Bump (x.y.z with y,z ≤ 9)
      - name: Bump version
        id: bump
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(currentVersion) {
            let [x, y, z] = currentVersion.split('.').map(Number);

            z++;
            if (z > 9) { z = 0; y++; }
            if (y > 9) { y = 0; x++; }

            return `${x}.${y}.${z}`;
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const newVersion = bumpVersion(pkg.version);

          pkg.version = newVersion;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

          fs.writeFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`, { flag: "a" });
          EOF

      # :seven: Ensure vsce installed
      - name: Ensure vsce is installed
        run: |
          if ! command -v vsce &> /dev/null; then
            npm install -g @vscode/vsce
          fi

      # :eight: Package extension
      - name: Package extension
        run: vsce package

      # :nine: Check version in BOTH marketplaces
      - name: Check version in both Marketplaces
        id: check_all
        run: |
          EXTENSION_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "Checking $EXTENSION_ID@$VERSION in both marketplaces..."

          # Microsoft Marketplace
          if npx vsce show $EXTENSION_ID@$VERSION -p "${{ secrets.VS_MARKETPLACE_TOKEN }}" >/dev/null 2>&1; then
            ms_exists=true
          else
            ms_exists=false
          fi

          # GitPod/OpenVSX Marketplace
          if npx ovsx show $EXTENSION_ID@$VERSION -p "${{ secrets.GITPOD_MARKETPLACE_TOKEN }}" >/dev/null 2>&1; then
            gitpod_exists=true
          else
            gitpod_exists=false
          fi

          # Decide if safe to publish
          if [ "$ms_exists" = true ] || [ "$gitpod_exists" = true ]; then
            echo "can_publish=false" >> $GITHUB_OUTPUT
            echo ":no_entry: Version exists in either MS or GitPod Marketplace — blocking publish."
            exit 0
          fi

          echo "can_publish=true" >> $GITHUB_OUTPUT
          echo "✔ Version does not exist in either marketplace — safe to publish."

      # :keycap_ten: Publish to Microsoft Marketplace ONLY IF SAFE
      - name: Publish to MS Marketplace
        if: steps.check_all.outputs.can_publish == 'true'
        run: |
          echo "Publishing to Microsoft Marketplace..."
          set +e
          output=$(npx vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }} 2>&1)
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            echo "MS Marketplace: version exists → continuing"
            exit 0
          fi

      # :one::one: Publish to GitPod (OpenVSX)
      - name: Publish to GitPod Marketplace
        if: steps.check_all.outputs.can_publish == 'true'
        run: |
          echo "Publishing to OpenVSX/GitPod..."
          set +e
          output=$(npx ovsx publish -p ${{ secrets.GITPOD_MARKETPLACE_TOKEN }} 2>&1)
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            echo "OpenVSX: version exists → continuing"
            exit 0
          fi

      # :one::two: Commit version bump
      - name: Commit and push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}" || echo "No changes"
          git push origin HEAD:${GITHUB_REF_NAME}

      # :one::three: Upload .vsix
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.bump.outputs.version }}
          path: "*.vsix"
