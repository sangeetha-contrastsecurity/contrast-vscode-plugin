name: Publish VS Code Extension

on:
  push:
    branches: [ "sacumen-devops-cicd-gitpod-ms" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      # :one: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # :two: Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # :three: Install dependenciesss
      - name: Install dependencies
        run: npm install

      # :four: Build extension
      - name: Build extension
        run: npm run build

      # :five: Run tests
      - name: Run tests
        run: npx jest || echo "No tests found"

      # :six: Custom Version Bump (x.y.z pattern with max 9)
      - name: Bump version
        id: bump
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(currentVersion) {
            let [x, y, z] = currentVersion.split('.').map(Number);
            z++;
            if (z > 9) { z = 0; y++; }
            if (y > 9) { y = 0; x++; }
            return `${x}.${y}.${z}`;
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const newVersion = bumpVersion(pkg.version);

          pkg.version = newVersion;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

          fs.writeFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`, { flag: "a" });
          EOF

      # :seven: Ensure vsce installed
      - name: Ensure vsce is installed
        run: |
          if ! command -v vsce &> /dev/null; then
            npm install -g @vscode/vsce
          fi

      # :eight: Package extension
      - name: Package extension
        run: vsce package

      # :nine: Check + display current deployed versions in BOTH marketplaces
      - name: Check versions in both Marketplaces
        id: check_version
        run: |
          EXTENSION_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo ":mag: Checking extension: $EXTENSION_ID"
          echo ":mag: New version to publish: $VERSION"
          echo ""

          ms_exists=false
          gitpod_exists=false

          echo ":pushpin: Microsoft Marketplace:"
          MS_VERSION=$(npx vsce show $EXTENSION_ID -p "${{ secrets.VS_MARKETPLACE_TOKEN }}" 2>/dev/null | grep "Version:" | awk '{print $2}')

          if [ -z "$MS_VERSION" ]; then
            echo " :x: Not published on Microsoft Marketplace"
          else
            echo " :white_check_mark: Current version on MS Marketplace = $MS_VERSION"
            if [ "$MS_VERSION" = "$VERSION" ]; then ms_exists=true; fi
          fi

          echo ""
          echo ":pushpin: GitPod / OpenVSX Marketplace:"
          GITPOD_VERSION=$(npx ovsx show $EXTENSION_ID -p "${{ secrets.GITPOD_MARKETPLACE_TOKEN }}" 2>/dev/null | grep "Version:" | awk '{print $2}')

          if [ -z "$GITPOD_VERSION" ]; then
            echo " :x: Not published on GitPod/OpenVSX"
          else
            echo " :white_check_mark: Current version on GitPod/OpenVSX = $GITPOD_VERSION"
            if [ "$GITPOD_VERSION" = "$VERSION" ]; then gitpod_exists=true; fi
          fi

          echo ""
          echo "-----------------------------------------"
          echo ":test_tube: Comparing with new version: $VERSION"
          echo "-----------------------------------------"

          if [ "$ms_exists" = true ] || [ "$gitpod_exists" = true ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo ":no_entry: Version $VERSION already exists — blocking publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✔ Version $VERSION does NOT exist — safe to publish."
          fi

      # :keycap_ten: Publish to Microsoft Marketplace ONLY IF SAFE
      - name: Publish to Visual Studio Marketplace
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "Publishing to MS Marketplace..."
          set +e
          output=$(npx vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            exit 0
          fi

          if [ $exit_code -ne 0 ]; then
            exit $exit_code
          fi

      # :one::one: Publish to GitPod (OpenVSX)
      - name: Publish to GitPod Visual Studio Marketplace
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo ":hourglass_flowing_sand: Publishing to GitPod Marketplace..."
          set +e
          output=$(npx ovsx publish -p ${{ secrets.GITPOD_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            echo ":warning: Detected 'already exists' message — publish actually succeeded."
            exit 0
          fi

          if [ $exit_code -ne 0 ]; then
            echo ":x: Publish failed with unexpected error."
            exit $exit_code
          fi
          
          echo ":white_check_mark: Publish step completed successfully."

      # :one::two: Commit version bump
      - name: Commit and push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}" || echo "No changes"
          git push origin HEAD:${GITHUB_REF_NAME}

      # :one::three: Upload .vsix as build artifact
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.bump.outputs.version }}
          path: "*.vsix"
